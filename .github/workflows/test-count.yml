name: TCK Test Count

on:
  pull_request:
    paths:
      - "docs/test-specifications/**"
      - "testCount.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-count.yml"
  push:
    branches:
      - main
      - feat/**
    paths:
      - "docs/test-specifications/**"
      - "testCount.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-count.yml"
  workflow_dispatch: {}  

permissions:
  contents: read

jobs:
  countTests:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test count script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running testCount.js..."
          npx ts-node testCount.ts
