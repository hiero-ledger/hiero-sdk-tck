# SPDX-License-Identifier: Apache-2.0
name: "System Compatibility (JS SDK)"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      custom-job-name:
        description: "The custom job name to use for the job(could include the version of the JS SDK, Solo, and consensus node):"
        required: false
        type: string
      solo-version:
        description: "The version of the Solo to use (defaults to 0.91.0 if not specified):"
        required: false
        type: string
        default: "0.91.0"
      consensus-node-version:
        description: "The version of the consensus node to use (defaults to latest stable version tag if not specified):"
        required: false
        type: string
      js-sdk-version:
        description: "The version of the JS SDK to use (defaults to latest tag if not specified):"
        required: false
        type: string
      test-matrix:
        description: "TCK test files or globs to run instead of the whole suite, one per line"
        required: false
        type: string
      artifact-name:
        description: "Name of the uploaded TCK report artifact, unique within a workflow run"
        required: false
        type: string
        default: "tck-report-js"
  workflow_call:
    inputs:
      custom-job-name:
        description: "The custom job name to use for the job"
        required: false
        type: string
      solo-version:
        description: "The version of the Solo to use"
        required: false
        type: string
        default: "0.91.0"
      consensus-node-version:
        description: "The version of the consensus node to use"
        required: false
        type: string
      js-sdk-version:
        description: "The version of the JS SDK to use"
        required: false
        type: string
      test-matrix:
        description: "TCK test files or globs to run instead of the whole suite, one per line"
        required: false
        type: string
      artifact-name:
        description: "Name of the uploaded TCK report artifact, unique within a workflow run"
        required: false
        type: string
        default: "tck-report-js"

defaults:
  run:
    shell: bash

jobs:
  # Execute TCK Regression Tests using specified version of hiero-consensus-node
  tck-regression:
    name: ${{ inputs.custom-job-name || 'System Compatibility' }}
    runs-on: hiero-client-sdk-linux-large
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      # Checkout the current TCK repository
      - name: Checkout TCK Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tck

      # Checkout the JS-SDK server
      - name: Checkout JS-SDK Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk-server
          repository: hiero-ledger/hiero-sdk-js
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      # Checkout the JS-SDK Version
      - name: Checkout JS-SDK Version
        run: |
          cd sdk-server
          if [ -n "${{ inputs.js-sdk-version }}" ]; then
            echo "Using specified JS-SDK version: ${{ inputs.js-sdk-version }}"
            git checkout ${{ inputs.js-sdk-version }}
          else
            echo "Using latest JS-SDK tag"
            git fetch --tags
            LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
            echo "Latest JS-SDK tag: $LATEST_TAG"
            git checkout $LATEST_TAG
          fi

      # Install Task runner
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
         version: 3.35.1

      - name: Install PNPM
        uses: step-security/action-setup@8beec6731697ff7a074963eaa56f6d8e02e1c399 # v6.1.0
        with:
          version: 9.15.5

      # Set up the node environment
      # Version 22 is the recommended version for solo.
      - name: Setup NodeJS Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Build the JS-SDK using its task
      - name: Build JS-SDK
        run: |
          task -v build
        working-directory: sdk-server

      # Set up and start the TCK server
      - name: Install and Start TCK Server
        id: start-sdk-server
        run: |
          # Share Long with the built SDK: its instanceof checks require one constructor.
          npm install --no-save .. ../node_modules/long
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createRequire } = require('node:module');
          const sdk = require.resolve('@hiero-ledger/sdk');
          assert.equal(sdk, require.resolve('..'), 'TCK must load the built SDK checkout');
          assert.equal(require('long'), createRequire(sdk)('long'), 'TCK and SDK must share Long');
          console.log(`TCK SDK: ${sdk}`);
          NODE
          nohup npm run start > tck-server.log 2>&1 &
          server_pid=$!
          echo "pid=${server_pid}" >> "${GITHUB_OUTPUT}"
        working-directory: sdk-server/tck

      # Wait for TCK server to be ready (nodemon stays alive after a crash, so check the port)
      - name: Wait for TCK Server
        run: |
          echo "Waiting for TCK server on port 8544..."
          for i in {1..30}; do
            if bash -c 'exec 3>/dev/tcp/127.0.0.1/8544' 2>/dev/null; then
              echo "TCK server is ready on port 8544!"
              exit 0
            fi
            echo "Still waiting... ($i/30)"
            sleep 2
          done
          echo "TCK server failed to become ready on port 8544"
          echo "Server logs:"
          cat sdk-server/tck/tck-server.log || echo "No server logs found"
          exit 1

      # Get Latest Consensus Node Version
      - name: Get Latest Consensus Node Version
        if: ${{ !inputs.consensus-node-version }}
        id: get-consensus-version
        run: |
          # Fetch latest stable version (excludes RC, beta, alpha versions)
          LATEST_TAG=$(git ls-remote --tags --refs https://github.com/hiero-ledger/hiero-consensus-node \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          echo "Latest consensus node tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # Prepare Hiero Solo
      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@328bc84c3b00a990a151418144fd682a4eb76ea6 # v0.19.0
        with:
          installMirrorNode: true
          soloVersion: ${{ inputs.solo-version || '0.91.0' }}
          mirrorNodeVersion: v0.138.0
          hieroVersion: ${{ inputs.consensus-node-version || steps.get-consensus-version.outputs.tag }}

      # Run the TCK through the action in this repository; `tck` is the path
      # the TCK checkout above uses. The action installs the client, waits for
      # the JSON-RPC server, runs the suite, writes the job summary and
      # uploads the report.
      - name: Run the TCK
        uses: ./tck
        with:
          test-matrix: ${{ inputs.test-matrix }}
          artifact-name: ${{ inputs.artifact-name || 'tck-report-js' }}

      # Stop the TCK server
      - name: Stop tck-server
        if: ${{ always() }}
        run: |
          echo ${{ steps.start-sdk-server.outputs.pid }}
          # Check if pid exists before killing (safest for PR automated runs)
          if [ -n "${{ steps.start-sdk-server.outputs.pid }}" ]; then
            kill -9 ${{ steps.start-sdk-server.outputs.pid }}
          fi