# SPDX-License-Identifier: Apache-2.0
name: "System Compatibility (CPP SDK)"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      custom-job-name:
        description: "The custom job name to use for the job(could include the version of the SDK, Solo, and consensus node):"
        required: false
        type: string
      solo-version:
        description: "The version of the Solo to use (defaults to 0.91.0 if not specified):"
        required: false
        type: string
        default: "0.91.0"
      consensus-node-version:
        description: "The version of the consensus node to use (defaults to latest stable version tag if not specified):"
        required: false
        type: string
      cpp-sdk-version:
        description: "The version of the CPP SDK to use (defaults to latest tag if not specified):"
        required: false
        type: string
      test-matrix:
        description: "TCK test files or globs to run instead of the whole suite, one per line"
        required: false
        type: string
      artifact-name:
        description: "Name of the uploaded TCK report artifact, unique within a workflow run"
        required: false
        type: string
        default: "tck-report-cpp"
  workflow_call:
    inputs:
      custom-job-name:
        description: "The custom job name to use for the job"
        required: false
        type: string
      solo-version:
        description: "The version of the Solo to use"
        required: false
        type: string
        default: "0.91.0"
      consensus-node-version:
        description: "The version of the consensus node to use"
        required: false
        type: string
      cpp-sdk-version:
        description: "The version of the CPP SDK to use"
        required: false
        type: string
      test-matrix:
        description: "TCK test files or globs to run instead of the whole suite, one per line"
        required: false
        type: string
      artifact-name:
        description: "Name of the uploaded TCK report artifact, unique within a workflow run"
        required: false
        type: string
        default: "tck-report-cpp"

defaults:
  run:
    shell: bash

jobs:
  # Execute TCK Regression Tests using specified version of hiero-consensus-node
  tck-regression:
    name: ${{ inputs.custom-job-name || 'System Compatibility' }}
    runs-on: hiero-client-sdk-linux-large
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      # Checkout the current TCK repository
      - name: Checkout TCK Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tck

      # Checkout the CPP SDK server
      - name: Checkout CPP SDK Server
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: sdk-server
          repository: hiero-ledger/hiero-sdk-cpp
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Checkout CPP SDK Version
        run: |
          cd sdk-server
          if [ -n "${{ inputs.cpp-sdk-version }}" ]; then
            echo "Using specified CPP SDK version: ${{ inputs.cpp-sdk-version }}"
            git checkout ${{ inputs.cpp-sdk-version }}
          else
            echo "Using latest CPP SDK tag"
            git fetch --tags
            LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
            echo "Latest CPP SDK tag: $LATEST_TAG"
            git checkout $LATEST_TAG
          fi

      # Set up the node environment
      - name: Setup NodeJS Environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
            node-version: 22
    
      - name: Install Linux Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libc6-dbg libgtest-dev build-essential

      - name: Ensure Binary Cache Path Exists
        run: mkdir -p "${{ github.workspace }}/b/vcpkg_cache"

      - name: Install CMake & Ninja
        uses: step-security/get-cmake@16c2bcb98b44e2c3a92d9474f8fd6f038d42de03 # v4.3.2
        with:
          useCloudCache: true

      - name: Setup VCPkg
        uses: step-security/run-vcpkg@f4f81d0f70f2e65432e7040c9677ce85e996d8b9 # v11.5.3
        with:
          binaryCachePath: ${{ github.workspace }}/b/vcpkg_cache
          vcpkgDirectory: ${{ github.workspace }}/sdk-server/vcpkg

      - name: Convert VCPkg to Full Clone
        working-directory: sdk-server/vcpkg
        run: |
          if [ -f .git/shallow ]; then
            echo "Repository is shallow, converting to full clone..."
            git fetch --unshallow --prune
          else
            echo "Repository is already a full clone, skipping unshallow."
          fi

      - name: CMake Build (Debug)
        working-directory: sdk-server
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          cmake --preset linux-x64-debug -DBUILD_TCK=ON
          cmake --build -j 6 --preset linux-x64-debug
      
      - name: Verify SDK Server Binary
        working-directory: sdk-server/build/linux-x64-debug
        run: |
          echo "Listing TCK binaries:"
          find . -type f -name "hiero-sdk-cpp-tck" -exec ls -lh {} \;

      # Set up and start the TCK server
      - name: Build and Start SDK Server
        id: start-sdk-server
        run: |
            ./hiero-sdk-cpp-tck > server.log 2>&1 &
            server_pid=$!
            echo "pid=${server_pid}" >> "${GITHUB_OUTPUT}"
            echo "Server started with PID: $server_pid"
        working-directory: sdk-server/build/linux-x64-debug/src/tck/Debug

      # Get Latest Consensus Node Version
      - name: Get Latest Consensus Node Version
        if: ${{ !inputs.consensus-node-version }}
        id: get-consensus-version
        run: |
          # Fetch latest stable version (excludes RC, beta, alpha versions)
          LATEST_TAG=$(git ls-remote --tags --refs https://github.com/hiero-ledger/hiero-consensus-node \
            | awk '{print $2}' \
            | sed 's|refs/tags/||' \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          echo "Latest consensus node tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # Prepare Hiero Solo
      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@328bc84c3b00a990a151418144fd682a4eb76ea6 # v0.19.0
        with:
          installMirrorNode: true
          soloVersion: ${{ inputs.solo-version || '0.91.0' }}
          mirrorNodeVersion: v0.138.0
          hieroVersion: ${{ inputs.consensus-node-version || steps.get-consensus-version.outputs.tag }}

      # Run the TCK through the action in this repository; `tck` is the path
      # the TCK checkout above uses. The action installs the client, waits for
      # the JSON-RPC server, runs the suite, writes the job summary and
      # uploads the report.
      - name: Run the TCK
        uses: ./tck
        with:
          test-matrix: ${{ inputs.test-matrix }}
          artifact-name: ${{ inputs.artifact-name || 'tck-report-cpp' }}

      # Stop the TCK server
      - name: Show Server Logs
        if: ${{ failure() }}
        run: |
          echo "Server logs:"
          cat server.log || echo "No server logs found"
        working-directory: sdk-server/build/linux-x64-debug/src/tck/Debug

      - name: Stop tck-server
        if: ${{ always() }}
        run: |
          echo ${{ steps.start-sdk-server.outputs.pid }}
          kill -9 ${{ steps.start-sdk-server.outputs.pid }} 2>/dev/null || echo "Server already stopped"
